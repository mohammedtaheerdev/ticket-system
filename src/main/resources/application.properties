spring.application.name=system
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ticket_system}
spring.datasource.username=${DATABASE_USERNAME:ticket_system}
spring.datasource.password=${DATABASE_PASSWORD:ticket_system}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
springdoc.swagger-ui.path=/swagger-ui.html
