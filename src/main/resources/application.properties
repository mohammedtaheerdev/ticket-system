spring.application.name=system
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ticket_system}
spring.datasource.username=${DATABASE_USERNAME:ticket_system}
spring.datasource.password=${DATABASE_PASSWORD:ticket_system}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.swagger-ui.path=/swagger-ui.html
